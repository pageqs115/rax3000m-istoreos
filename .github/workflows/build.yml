name: Build iStoreOS for RAX3000M eMMC

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload to Release'
        required: false
        default: 'true'

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  REPO_COMMIT: dcf11c832a95595e6b919b88d6cd649bd9343a1f
  CONFIG_FILE: seed/rax3000m-emmc.seed
  DIY_SCRIPT: build.sh

jobs:
  stage1-toolchain-kernel:
    name: Stage 1 - Toolchain + Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 340

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Free disk space
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get -y clean
        df -hT

    - name: Init build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pip libpython3.10-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Clone istoreos source
      working-directory: ${{ github.workspace }}
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH istoreos
        cd istoreos
        git fetch origin $REPO_COMMIT --depth=1
        git checkout $REPO_COMMIT
        echo "SOURCE_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        git log -1 --format='Source: %h %cd %s' --date=format:'%Y-%m-%d'

    - name: Run DIY script
      working-directory: ${{ github.workspace }}/istoreos
      run: |
        chmod +x $GITHUB_WORKSPACE/$DIY_SCRIPT
        $GITHUB_WORKSPACE/$DIY_SCRIPT

    - name: Load config and download sources
      working-directory: ${{ github.workspace }}/istoreos
      run: |
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        make defconfig
        echo "====== enabled key packages ======"
        grep -E "cmcc_rax3000m|openclash|passwall|tailscale|rtp2httpd|luci-app-store|PARTSIZE" .config | grep =y || true
        make download -j$(nproc)
        find dl -size -1025c -exec ls -l {} \;
        find dl -size -1025c -exec rm -f {} \;

    - name: Compile tools
      working-directory: ${{ github.workspace }}/istoreos
      run: |
        make tools/install -j$(nproc) || make tools/install -j1 V=s

    - name: Compile toolchain
      working-directory: ${{ github.workspace }}/istoreos
      run: |
        make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

    - name: Compile kernel
      working-directory: ${{ github.workspace }}/istoreos
      run: |
        make target/compile -j$(nproc) || make target/compile -j1 V=s

    - name: Pack workspace
      working-directory: ${{ github.workspace }}
      run: |
        rm -rf istoreos/.git
        tar -cf - istoreos | zstd -T0 -1 > istoreos-workspace.tar.zst
        ls -lh istoreos-workspace.tar.zst
        df -hT

    - name: Upload workspace artifact
      uses: actions/upload-artifact@main
      with:
        name: istoreos-workspace
        path: istoreos-workspace.tar.zst
        retention-days: 1
        compression-level: 0

  stage2-packages-images:
    name: Stage 2 - Packages + Images
    needs: stage1-toolchain-kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 340

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Free disk space
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get -y clean
        df -hT

    - name: Init build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pip libpython3.10-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Download workspace artifact
      uses: actions/download-artifact@main
      with:
        name: istoreos-workspace
        path: ${{ github.workspace }}

    - name: Extract workspace
      working-directory: ${{ github.workspace }}
      run: |
        ls -lh istoreos-workspace.tar.zst
        zstd -T0 -d istoreos-workspace.tar.zst -o workspace.tar
        tar -xf workspace.tar
        rm -f workspace.tar istoreos-workspace.tar.zst
        ls istoreos | head -20
        test -d istoreos/staging_dir/toolchain-*/ || { echo "toolchain missing!"; exit 1; }
        df -hT

    - name: Compile packages and images
      working-directory: ${{ github.workspace }}/istoreos
      run: |
        make -j$(nproc) || make -j1 V=s
        echo "COMPILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        df -hT

    - name: Check space and organize files
      if: always()
      working-directory: ${{ github.workspace }}/istoreos
      run: |
        cd bin/targets/mediatek/filogic 2>/dev/null || { echo "BUILD FAILED - no output"; exit 1; }
        rm -rf packages
        echo "====== build output ======"
        ls -lh
        mkdir -p $GITHUB_WORKSPACE/output
        cp -f * $GITHUB_WORKSPACE/output/ 2>/dev/null || true
        cd $GITHUB_WORKSPACE
        echo "====== final artifacts ======"
        ls -lh output/

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: istoreos-rax3000m-emmc-${{ env.COMPILE_DATE }}
        path: output/

    - name: Upload to release
      if: github.event.inputs.upload_release == 'true' && !cancelled()
      uses: softprops/action-gh-release@master
      with:
        tag_name: istoreos-24.10.5-rax3000m-emmc-${{ env.COMPILE_DATE }}
        files: output/*
        body: |
          iStoreOS 24.10.5 for CMCC RAX3000M (eMMC 算力版)
          - Source: istoreos/istoreos @ ${{ env.SOURCE_COMMIT }} (24.10.5-2025123110 同版)
          - 内置: iStore / openclash / passwall / tailscale / rtp2httpd(IPTV) / 中文界面
          - emmc sysupgrade: istoreos-*-cmcc_rax3000m-squashfs-sysupgrade.itb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
